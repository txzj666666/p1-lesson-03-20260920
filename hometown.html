<!DOCTYPE html>
<!--
  家乡介绍子页面 —— 从首页"我的家乡：广东汕头"点进来，构成多页网站。
  结构和首页完全一样：header 导航（可跳回主页各栏目）→ main（一个 section：简介 + 图片墙）→ footer。
  图片墙 hometown-gallery：桌面端 grid 排 2×2，每张卡是 figure（img 图片 + figcaption 图注）；
  手机端媒体查询自动变单列。
  想加照片：① 图片放进 assets/ ② 复制一个 <li>...</li> 改 src、alt 和图注文字。
-->
<html lang="zh-CN">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="noindex, nofollow" name="robots"/>
  <meta content="我的家乡 · 广东汕头：城市介绍与照片。" name="description"/>
  <title>
   我的家乡 · 广东汕头
  </title>
  <link href="assets/favicon.svg" rel="icon" type="image/svg+xml"/>
  <!-- 复用主页的样式表，保证两个页面观感一致。 -->

  <link href="resume-enhance.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="site-header">
   <div class="container header-inner">
    <a class="brand" href="index.html">
     我的主页

    <nav aria-label="主导航">
     <a href="index.html#about">
      关于

     <a href="index.html#skills">

     <a href="index.html#hobbies">
      爱好
     </a>
     <a href="index.html#portfolio">
      作品
     </a>
    </nav>
   </div>
  </header>
  <main id="main">
   <section class="section" id="hometown-page">
    <div class="container">
     <header class="section-heading">
      <h2>
       我的家乡 · 广东汕头
      </h2>
     </header>
     <div class="section-content">
      <p class="hometown-intro">
       汕头在广东省东部沿海、韩江入海口一带，是潮汕文化的重要发源地之一，也是一座开埠较早的滨海城市。成片的骑楼老街、一句"食茶未"的工夫茶、傍晚的海风，还有怎么吃都不腻的潮汕菜，就是我印象里的家乡。
      </p>
      <!-- TASK-HTML：复制下面任意一个 li，可以继续添加家乡的照片。 -->
      <ul class="hometown-gallery">
       <li>
        <figure>
         <img alt="汕头小公园开埠区的骑楼与中山纪念亭" decoding="async" height="1280" src="assets/hometown-park.jpg" width="1920"/>
         <figcaption>
          <strong>
           小公园
          </strong>
          汕头老城的中心，一圈骑楼围着中山纪念亭，是这座开埠城市的标志。
         </figcaption>
        </figure>
       </li>
       <li>
        <figure>
         <img alt="汕头海滨路上的日落，夕阳落在跨海大桥后方" decoding="async" height="181" src="assets/hometown-sunset.webp" width="241"/>
         <figcaption>
          <strong>
           海滨路的日落
          </strong>
          傍晚沿着海滨路走一段，看太阳一点点落到桥后，海面被染成金色。
         </figcaption>
        </figure>
       </li>
       <li>
        <figure>
         <img alt="潮汕牛肉火锅，清汤锅底与多盘现切牛肉" decoding="async" height="194" src="assets/hometown-hotpot.webp" width="291"/>
         <figcaption>
          <strong>
           牛肉火锅
          </strong>
          潮汕牛肉火锅讲究现切现涮，一锅清汤配不同部位的肉，越简单的做法越见功夫。
         </figcaption>
        </figure>
       </li>
       <li>
        <figure>
         <img alt="潮汕生腌，腌虾、腌蟹与腌血蚶盛在大盆里" decoding="async" height="994" src="assets/hometown-shengyan.jpg" width="1591"/>
         <figcaption>
          <strong>
           生腌
          </strong>
          本地人叫它"潮汕毒药"——腌虾、腌蟹、腌血蚶用酱油蒜辣一拌，一吃就停不下来。
         </figcaption>
        </figure>
       </li>
      </ul>
     </div>
    </div>
   </section>
  </main>
  <footer>
   <div class="container footer-inner">
